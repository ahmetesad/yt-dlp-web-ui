<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>yt-dlp web UI</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="hero-card">
      <div class="top-bar">
        <button class="link-button mono" id="logoutButton" type="button" hidden>
          forget session
        </button>
      </div>

      <section id="authMount"></section>

      <form class="download-panel" id="downloadForm" novalidate>
        <label class="field field-url" for="mediaUrl">
          <span class="field-label mono">video or audio url</span>
          <input
            id="mediaUrl"
            name="mediaUrl"
            type="url"
            placeholder="https://www.youtube.com/watch?v=..."
            autocomplete="off"
            inputmode="url"
          >
        </label>

        <div class="panel-grid">
          <fieldset class="field-group">
            <legend class="field-label mono">quality</legend>
            <div class="choice-grid" id="qualityGroup"></div>
            <button class="link-button quality-toggle mono" id="qualityToggle" type="button">
              more qualities
            </button>
          </fieldset>

          <fieldset class="field-group">
            <legend class="field-label mono">format</legend>
            <div class="choice-grid choice-grid-tight" id="formatGroup"></div>
          </fieldset>

          <fieldset class="field-group" id="convertField" hidden>
            <legend class="field-label mono">convert</legend>
            <div class="choice-grid choice-grid-tight" id="convertGroup"></div>
          </fieldset>

          <div class="toggle-pair">
            <label class="toggle-card toggle-card-compact mono" for="audioOnly">
              <input id="audioOnly" name="audioOnly" type="checkbox">
              <span class="toggle-text">
                <span>audio</span>
                <span>only</span>
              </span>
            </label>

            <label class="toggle-card toggle-card-compact mono" for="includePlaylist">
              <input id="includePlaylist" name="includePlaylist" type="checkbox">
              <span class="toggle-text">
                <span>allow</span>
                <span>playlist</span>
              </span>
            </label>
          </div>
        </div>

        <!-- <p class="hint" id="settingsHint">
          Settings stay on this device until you reset them.
        </p> -->

        <p class="status" id="statusMessage" aria-live="polite" hidden></p>

        <section class="results" id="results" hidden>
          <div class="results-head">
            <span class="field-label mono" id="resultsLabel">results</span>
          </div>
          <div class="results-list" id="resultsList"></div>
        </section>

        <div class="action-row action-row-end action-row-mobile-sticky">
          <div class="action-progress" id="actionProgress" hidden>
            <p class="action-progress-label mono" id="actionProgressLabel">working</p>
            <div
              class="action-progress-track"
              id="actionProgressTrack"
              role="progressbar"
              aria-label="Download progress"
              aria-valuemin="0"
              aria-valuemax="100"
            >
              <span class="action-progress-meter" id="actionProgressMeter"></span>
            </div>
          </div>

          <button class="action action-muted" id="resetSettingsBtn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path>
              <path d="M3 3v5h5"></path>
            </svg>
            <span>Reset defaults</span>
          </button>
          <button class="action action-muted" id="getLinkButton" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10 13a5 5 0 0 0 7.07 0l2.12-2.12a5 5 0 0 0-7.07-7.07L10.6 5.33"></path>
              <path d="M14 11a5 5 0 0 0-7.07 0L4.81 13.12a5 5 0 0 0 7.07 7.07l1.53-1.52"></path>
            </svg>
            <span>Get link</span>
          </button>
          <button class="action" id="downloadButton" type="submit">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 4v10"></path>
              <path d="m8 10 4 4 4-4"></path>
              <path d="M5 19h14"></path>
            </svg>
            <span>Download</span>
          </button>
        </div>
      </form>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
